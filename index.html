<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>سوبر آبل | نظام إدارة الفريق</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#201C1D">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سوبر آبل">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F7F6F3;
    --surface:#FFFFFF;
    --surface-2:#FAF9F6;
    --border:#E9E5DC;
    --primary:#201C1D;
    --primary-dark:#000000;
    --primary-tint:#FFF3D6;
    --accent:#FDB92A;
    --accent-tint:#FFF6E0;
    --success:#1FAE7A;
    --success-tint:#E4F7EF;
    --warning:#D9791A;
    --warning-tint:#FCEEDB;
    --danger:#E5484D;
    --danger-tint:#FDEBEC;
    --text:#201C1D;
    --text-muted:#6B6660;
    --text-faint:#A29C92;
    --radius:16px;
    --radius-sm:10px;
    --shadow: 0 1px 2px rgba(20,15,10,0.05), 0 8px 24px rgba(20,15,10,0.07);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);}
  #app{min-height:100vh;}
  h1,h2,h3,h4{margin:0;font-weight:800;}
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--primary-tint);}

  /* ---------- shared / auth screens ---------- */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
    radial-gradient(circle at 15% 20%, rgba(32,28,29,0.06), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(253,185,42,0.16), transparent 45%),
    var(--bg);}
  .auth-card{width:100%;max-width:420px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:36px 32px;border:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .brand-mark{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;}
  .brand-mark img{width:100%;height:100%;object-fit:contain;}
  .brand-name{font-size:15.5px;font-weight:800;}
  .brand-name span{color:var(--primary);}
  .brand-tagline{font-size:10.5px;color:var(--text-faint);margin-top:1px;}
  .sidebar .brand-tagline{color:rgba(255,255,255,0.4);}
  .auth-title{font-size:20px;margin-bottom:4px;}
  .auth-sub{color:var(--text-muted);font-size:12.5px;margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface-2);font-size:16px;outline:none;transition:.15s;color:var(--text);font-family:inherit;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);background:#fff;}
  .btn{padding:12px 18px;border-radius:var(--radius-sm);font-weight:700;font-size:14.5px;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary{background:var(--primary);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:transparent;color:var(--text-muted);border:1.5px solid var(--border);}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
  .btn-sm{padding:8px 12px;font-size:13px;}
  .claim-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  .claim-action-btn{width:100% !important;padding:6px 8px !important;font-size:11.5px !important;white-space:nowrap;}
  .btn-danger{background:var(--danger-tint);color:var(--danger);}
  .auth-error{background:var(--danger-tint);color:var(--danger);padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;font-weight:600;}
  .auth-note{margin-top:18px;font-size:12.5px;color:var(--text-faint);line-height:1.9;background:var(--surface-2);padding:12px 14px;border-radius:var(--radius-sm);}

  /* ---------- app shell ---------- */
  .shell{display:flex;min-height:100vh;position:relative;}
  .mobile-topbar{display:none;}
  .mobile-overlay{display:none;}
  .sidebar{width:252px;flex:none;background:#17130E;padding:22px 16px;display:flex;flex-direction:column;}
  .sidebar .brand{padding:0 6px;margin-bottom:24px;}
  .sidebar .brand-name{color:#fff;}
  .sidebar .brand-name span{color:var(--accent);}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;color:rgba(255,255,255,0.6);font-weight:700;font-size:13.5px;margin-bottom:3px;background:transparent;width:100%;text-align:right;transition:.15s;}
  .nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .nav-item.active{background:var(--accent);color:#1A1408;}
  .nav-icon{display:flex;align-items:center;justify-content:center;flex:none;opacity:.95;}
  .nav-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;flex:none;}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.1);}
  .user-chip{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(255,255,255,0.05);border-radius:14px;margin-bottom:10px;}
  .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex:none;}
  .user-chip-name{font-size:13.5px;font-weight:700;color:#fff;}
  .user-chip-role{font-size:11px;color:var(--accent);margin-top:1px;}
  .sidebar .btn-ghost{color:rgba(255,255,255,0.55);border-color:rgba(255,255,255,0.15);}
  .sidebar .btn-ghost:hover{color:var(--accent);border-color:var(--accent);}

  .main{flex:1;padding:20px 26px;max-width:calc(100vw - 252px);}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:14px;}
  .page-title{font-size:18px;}
  .page-sub{color:var(--text-muted);font-size:12px;margin-top:3px;}
  .topbar-actions{display:flex;align-items:center;gap:10px;flex:none;}
  .bell-btn{position:relative;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;}
  .bell-dot{position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);}
  .notif-bell-wrap{position:relative;}
  .notif-dropdown{position:absolute;top:calc(100% + 10px);left:0;width:340px;max-width:90vw;max-height:440px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 12px 32px rgba(0,0,0,0.18);z-index:200;display:flex;flex-direction:column;overflow:hidden;}
  .notif-dropdown-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);flex:none;}
  .notif-dropdown-body{overflow-y:auto;flex:1;}
  .notif-dropdown-item{display:flex;gap:10px;padding:11px 14px;width:100%;text-align:right;border-bottom:1px solid var(--border);background:none;position:relative;}
  .notif-dropdown-item:hover{background:var(--surface-2);}
  .notif-dropdown-item.unread{background:var(--primary-tint);}
  .notif-dropdown-msg{font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .notif-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;align-self:center;}
  .notif-dropdown-footer{padding:11px;text-align:center;font-size:12.5px;font-weight:700;color:var(--primary);background:var(--surface-2);flex:none;}
  @media(max-width:860px){ .notif-dropdown{position:fixed;top:64px;left:12px;right:12px;width:auto;max-width:none;} }

  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:2fr 1fr;}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);}
  .stat-card{padding:14px 16px;}
  .stat-label{font-size:11.5px;color:var(--text-muted);font-weight:700;margin-bottom:6px;}
  .stat-value{font-size:21px;font-weight:800;}
  .stat-sub{font-size:11px;color:var(--text-faint);margin-top:5px;}

  .stat-card-v2{display:flex;flex-direction:column;gap:12px;}
  .stat-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;}
  .stat-trend{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
  .stat-trend.up{color:var(--success);}
  .stat-trend.down{color:var(--danger);}

  .kanban-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start;}
  @media(max-width:1100px){.kanban-wrap{grid-template-columns:1fr;}}
  .kanban-col{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);}
  .kanban-col-head{padding:10px 12px;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;}
  .kanban-col-body{padding:10px;background:var(--surface-2);min-height:60px;max-height:420px;overflow-y:auto;}
  .kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:9px;}
  .kanban-card-title{font-weight:700;font-size:12px;margin-bottom:5px;line-height:1.5;}
  .kanban-card-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-faint);}

  .activity-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
  .activity-item:last-child{border-bottom:none;}
  .activity-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none;}
  .activity-text{font-size:13px;line-height:1.6;}
  .activity-time{font-size:11px;color:var(--text-faint);margin-top:2px;}

  .section-title{font-size:13.5px;font-weight:800;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;}
  .subtab-nav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .subtab-btn{padding:7px 13px;border-radius:100px;font-size:12px;font-weight:700;background:var(--surface);border:1.5px solid var(--border);color:var(--text-muted);}
  .subtab-btn:hover{border-color:var(--accent);color:var(--text);}
  .subtab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:right;color:var(--text-muted);font-weight:700;font-size:11px;padding:7px 9px;border-bottom:1.5px solid var(--border);}
  td{padding:9px 9px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}

  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:10.5px;font-weight:700;}
  .badge-success{background:var(--success-tint);color:var(--success);}
  .badge-warning{background:var(--warning-tint);color:var(--warning);}
  .badge-danger{background:var(--danger-tint);color:var(--danger);}
  .badge-primary{background:var(--primary-tint);color:var(--primary);}
  .badge-muted{background:var(--surface-2);color:var(--text-muted);}
  .badge-review{background:#EFE7FF;color:#6B3FD1;}
  .badge-new{background:#FFF0DB;color:#C2660A;}
  .badge-inprogress{background:#E3ECFB;color:#2A5FCC;}

  .tasks-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));gap:12px;}
  .task-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;}
  .task-card-v2{border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
  .task-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .task-card-head .task-open-link{margin-bottom:0;flex:1;min-width:0;}
  .task-card-head .badge{flex:none;}
  .task-info-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:11.5px;color:var(--text-muted);margin-bottom:12px;}
  .task-comment-count{color:var(--primary);font-weight:700;}
  .task-assignee-line{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  .task-assignee-names{font-size:11.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .task-client-name{font-size:10.5px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .task-card-menu-btn{background:none;border:none;font-size:14px;padding:4px 6px;cursor:pointer;opacity:0.45;border-radius:6px;}
  .task-card-menu-btn:hover{opacity:1;background:var(--danger-tint);}
  .task-open-link{display:block;width:100%;text-align:right;background:none;border:none;padding:0;margin-bottom:10px;cursor:pointer;}
  .task-title{display:block;font-weight:800;font-size:13.5px;margin-bottom:4px;color:var(--text);}
  .task-desc{display:block;font-size:12px;color:var(--text-muted);line-height:1.6;}
  .task-card-topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
  .task-hero{border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .chat-thread{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
  .chat-bubble-row{display:flex;gap:8px;align-items:flex-start;}
  .chat-bubble-row.mine{flex-direction:row-reverse;}
  .chat-bubble{background:var(--surface-2);border-radius:14px;padding:8px 12px;max-width:78%;}
  .chat-bubble.mine{background:var(--primary-tint);}
  .chat-bubble-name{font-size:11px;font-weight:800;color:var(--primary);margin-bottom:2px;}
  .chat-bubble-text{font-size:13px;line-height:1.6;}
  .chat-bubble-time{font-size:10px;color:var(--text-faint);margin-top:4px;}

  .pwa-banner{position:fixed;bottom:16px;left:16px;right:16px;max-width:520px;margin:0 auto;z-index:300;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 28px rgba(0,0,0,0.18);padding:12px 14px;display:flex;align-items:center;gap:12px;}
  .pwa-banner-icon{width:42px;height:42px;border-radius:10px;flex:none;border:1px solid var(--border);}
  .pwa-banner-close{background:none;border:none;font-size:15px;color:var(--text-faint);cursor:pointer;padding:4px 8px;}
  .team-chat-widget{position:fixed;bottom:22px;left:22px;z-index:150;display:flex;flex-direction:column;align-items:flex-start;gap:12px;}
  .team-chat-bubble-btn{position:relative;width:58px;height:58px;border-radius:50%;background:var(--primary);color:#fff;font-size:24px;box-shadow:0 6px 20px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;flex:none;overflow:visible;border:none;padding:0;}
  .team-chat-bubble-btn img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .team-chat-bubble-btn:hover{transform:scale(1.05);}
  .team-chat-dot{position:absolute;top:-6px;left:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--danger);border:2.5px solid #fff;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.35);z-index:2;}
  .team-chat-panel{width:330px;max-width:calc(100vw - 44px);height:440px;max-height:70vh;background:var(--surface);border-radius:var(--radius);box-shadow:0 10px 40px rgba(0,0,0,0.3);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);}
  .team-chat-panel-head{background:var(--primary);color:#fff;padding:12px 16px;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;flex:none;}
  .team-chat-close-btn{background:rgba(255,255,255,0.15);color:#fff;width:26px;height:26px;border-radius:50%;font-size:13px;}
  .team-chat-panel-body{flex:1;overflow-y:auto;padding:14px;margin:0;}
  .team-chat-panel-foot{flex:none;display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);}
  .team-chat-panel-foot input{flex:1;padding:9px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface-2);font-size:16px;}
  @media(max-width:860px){
    .team-chat-widget{bottom:calc(16px + env(safe-area-inset-bottom));left:16px;}
    .pwa-banner{bottom:calc(88px + env(safe-area-inset-bottom));}
    .team-chat-panel{width:calc(100vw - 32px);height:60vh;}
  }
  .task-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .task-card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--border);margin-top:auto;flex-wrap:wrap;}
  .task-assignees-mini{font-size:11.5px;color:var(--text-faint);}
  .task-card-btn{padding:5px 11px !important;font-size:11px !important;}
  .prompt-card{display:flex;flex-direction:column;}
  .prompt-card-img{width:100%;height:140px;object-fit:cover;border-radius:var(--radius-sm);margin-bottom:10px;background:var(--surface-2);}
  .prompt-card-text{font-size:12px;color:var(--text-muted);line-height:1.7;background:var(--surface-2);border-radius:var(--radius-sm);padding:10px;max-height:110px;overflow-y:auto;white-space:pre-wrap;flex:1;}
  .task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .assignee-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px dashed var(--border);font-size:13px;}
  .check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .check.done{background:var(--success);border-color:var(--success);color:#fff;}

  .modal-bg{position:fixed;inset:0;background:rgba(20,15,40,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:18px;padding:26px;width:100%;max-width:480px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal-title{font-size:15px;margin-bottom:14px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .chip-select{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);}
  .mention-dropdown{position:absolute;bottom:calc(100% + 6px);right:0;left:0;max-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.15);overflow:hidden;z-index:50;}
  .mention-item{display:block;width:100%;text-align:right;padding:9px 14px;font-size:13px;font-weight:700;background:none;border-bottom:1px solid var(--border);}
  .mention-item:last-child{border-bottom:none;}
  .mention-item:hover{background:var(--primary-tint);}
  .chip{padding:6px 12px;border-radius:100px;font-size:12.5px;font-weight:700;background:#fff;border:1.5px solid var(--border);color:var(--text-muted);}
  .chip.sel{background:var(--primary);color:#fff;border-color:var(--primary);}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}

  .notif-item{display:flex;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border);}
  .notif-item.unread{background:var(--primary-tint);border-radius:8px;}
  .notif-item.clickable{cursor:pointer;}
  .notif-icon{width:34px;height:34px;border-radius:10px;background:var(--primary-tint);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;font-size:15px;}
  .notif-text{font-size:13.5px;line-height:1.6;}
  .notif-time{font-size:11px;color:var(--text-faint);margin-top:2px;}

  .whatsapp-banner{display:flex;gap:10px;align-items:flex-start;background:var(--success-tint);border:1px solid rgba(31,174,122,0.25);padding:12px 14px;border-radius:var(--radius-sm);font-size:12.5px;color:#146B4D;line-height:1.8;margin-bottom:18px;}

<div id="app"></div>

<script>
/* =========================================================
   SUPER APPLE — TEAM MANAGEMENT SYSTEM
   Data is stored in a real MySQL database via the PHP API
   in api/index.php (see api/config.php for DB credentials).
   ========================================================= */

const API = 'api/index.php';

let state = {
  users: [], tasks: [], attendance: [], points: [], notifications: [], settings: null,
  clients: [], leaveRequests: [], departments: [], waLog: [], openTaskId: null, taskComments: [], claims: [], claimReminderLog: [], claimReminderLogFor: null, waConversations: [], waThread: [], waActivePhone: null, waConversationsLoaded: false, teamChat: [], teamChatLastId: 0, teamChatOpen: false, teamChatUnreadCount: 0, prompts: [], promptFilter: 'all', promptFormOpen: false, projects: [], openProjectId: null, projectModal: false, projectFilterTab: 'all', taskStatusLog: [], attachmentsByEntity: {}, projectActivity: [], projectDetail: null, executiveDashboard: null, workload: [], unreadNotifCount: 0, notifDropdownOpen: false, mentionSuggestions: [], mentionDropdownOpen: false, taskMentionable: [], motivationMessages: [], motivationSentToday: 0, myPasswordModal: false, resetPassModal: null,
  currentUser: null, hasUsers: false, loading: true, loginError: '', fatalError: null,
  adminTab: 'dashboard', empTab: 'dashboard', reportsTab: 'overview', taskFilterTab: 'active', pointsMonth: null, reportFilter: { preset: 'thisMonth', from: '', to: '' },
  taskModal: false, empModal: false, clientModal: false, departmentModal: false, claimModal: false, scheduleModal: null, leaveModal: false, checkingIn: false, mobileMenuOpen: false, toast: null
};
const DEFAULT_SETTINGS = { workStart:'08:00', graceMinutes:15, pointsOnTime:20, pointsEarlyBonus:10, earlyBonusHours:24, pointsAttendance:5, penaltyLate:5, penaltyAbsent:10, whatsappPhoneId:'', whatsappToken:'', whatsappTemplate:'hello_world' };

async function apiGet(action){
  try{
    const res = await fetch(`${API}?action=${action}`, { credentials:'same-origin' });
    return await res.json();
  }catch(e){ return { error: 'تعذر الاتصال بالسيرفر' }; }
}
async function apiPost(action, body){
  try{
    const res = await fetch(`${API}?action=${action}`, {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})
    });
    return await res.json();
  }catch(e){ return { error: 'تعذر الاتصال بالسيرفر' }; }
}
async function apiUpload(action, formData){
  try{
    const res = await fetch(`${API}?action=${action}`, { method:'POST', credentials:'same-origin', body: formData });
    return await res.json();
  }catch(e){ return { error: 'تعذر الاتصال بالسيرفر' }; }
}

async function init(){
  const data = await apiGet('bootstrap');
  if(data.error){ state.loading=false; state.fatalError = data.error; render(); return; }
  applyBootstrap(data);
  state.loading = false;
  render();
  if(state.currentUser && state.currentUser.role==='admin') loadExecutiveDashboard();
  if(state.currentUser) loadUnreadNotifCount();
}
async function refresh(){
  const data = await apiGet('bootstrap');
  if(data.error){ state.fatalError = data.error; render(); return; }
  applyBootstrap(data);
  render();
}
function applyBootstrap(data){
  state.hasUsers = !!data.hasUsers;
  state.currentUser = data.currentUser || null;
  state.settings = data.settings || DEFAULT_SETTINGS;
  state.users = data.users || [];
  state.clients = data.clients || [];
  state.departments = data.departments || [];
  state.claims = data.claims || [];
  state.prompts = data.prompts || [];
  state.projects = data.projects || [];
  state.leaveRequests = data.leaveRequests || [];
  state.tasks = (data.tasks || []).map(t => ({ ...t, assignees: (t.assignees||[]).map(a => ({ ...a, done: !!a.done })) }));
  state.attendance = data.attendance || [];
  state.points = (data.points || []).map(p => ({ ...p, points: Number(p.points) }));
  state.notifications = data.notifications || [];
}

function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowTime(){ const d=new Date(); return d.toTimeString().slice(0,5); }
function fmtDate(d){ return new Date(d).toLocaleDateString('ar-EG',{day:'numeric',month:'short'}); }
function fmtDateTime(d){ return new Date(d).toLocaleString('ar-EG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function timeAgo(d){
  const diff = Math.floor((new Date() - new Date(d))/1000);
  if(diff < 60) return 'الآن';
  if(diff < 3600) return `قبل ${Math.floor(diff/60)} دقيقة`;
  if(diff < 86400) return `قبل ${Math.floor(diff/3600)} ساعة`;
  return `قبل ${Math.floor(diff/86400)} يوم`;
}
function showToast(msg){ state.toast = msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2600); }

/* ---------------- نظام النقاط الشهري ----------------
   النقاط تُحسب لكل شهر لوحده (تبدأ من صفر أول كل شهر).
   state.pointsMonth بصيغة 'YYYY-MM'، وافتراضيًا الشهر الحالي.
   السجل الكامل محفوظ بقاعدة البيانات دايمًا (أرشيف)، إحنا بس بنفلتر العرض. */
function currentMonthKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function pointsInMonth(monthKey){
  return (state.points||[]).filter(p => (p.date||'').slice(0,7) === monthKey);
}
function userPoints(userId, monthKey){
  const m = monthKey || state.pointsMonth || currentMonthKey();
  return pointsInMonth(m).filter(p=>p.userId===userId).reduce((s,p)=>s+p.points,0);
}
// إجمالي نقاط الموظف عبر كل الأشهر (للأرشيف/الرصيد التراكمي)
function userPointsAllTime(userId){
  return (state.points||[]).filter(p=>p.userId===userId).reduce((s,p)=>s+p.points,0);
}
// كل الأشهر يلي فيها نقاط فعليًا، مرتبة من الأحدث (لقائمة الأرشيف)
function availablePointMonths(){
  const set = new Set((state.points||[]).map(p=>(p.date||'').slice(0,7)).filter(Boolean));
  set.add(currentMonthKey());
  return [...set].sort().reverse();
}
function monthLabel(key){
  const [y,m] = key.split('-');
  const d = new Date(parseInt(y), parseInt(m)-1, 1);
  return d.toLocaleDateString('ar-EG', {month:'long', year:'numeric'});
}

/* ---------------- AUTH ---------------- */
async function handleLogin(e){
  e.preventDefault();
  const email = e.target.email.value.trim();
  const pass = e.target.password.value;

  if(res.error){ state.loginError = 'البريد الإلكتروني أو كلمة السر غير صحيحة'; render(); return; }
  state.loginError = '';
  await refresh();
  if(state.currentUser && state.currentUser.role==='admin') loadExecutiveDashboard();
  if(state.currentUser) loadUnreadNotifCount();
}

  await apiPost('logout', {});

}

function handleCopyPrompt(id){
  const el = document.getElementById('promptText-'+id);
  if(!el) return;
  const text = el.innerText;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast('تم نسخ البرومبت 📋')).catch(()=>showToast('تعذر النسخ'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); showToast('تم نسخ البرومبت 📋'); }catch(e){ showToast('تعذر النسخ'); }
    document.body.removeChild(ta);
  }
}

/* ---------------- TEAM CHAT ---------------- */
let audioCtx = null;
function unlockAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  if(window.Notification && Notification.permission==='default') Notification.requestPermission();
}
document.addEventListener('click', unlockAudio, { once:false });

function showBrowserNotification(senderName, message){
  if(!window.Notification || Notification.permission!=='granted') return;
  try{
    const n = new Notification('💬 ' + senderName + ' — دردشة الفريق', {
      body: message.slice(0,120),
      tag: 'superapple-teamchat',
      renotify: true,
    });
    n.onclick = ()=>{ window.focus(); n.close(); };
    setTimeout(()=>n.close(), 8000);
  }catch(e){ /* بعض المتصفحات على الموبايل ما بتدعمها */ }
}

function playChatBeep(){
  try{
    unlockAudio();
    if(!audioCtx || audioCtx.state !== 'running') return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, audioCtx.currentTime);
    o.frequency.setValueAtTime(660, audioCtx.currentTime + 0.12);
    g.gain.setValueAtTime(0.18, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    o.start();
    o.stop(audioCtx.currentTime + 0.35);
  }catch(e){ /* المتصفح رفض تشغيل الصوت (نادر) */ }
}
function scrollChatToBottom(){
  setTimeout(()=>{
    const t1 = document.getElementById('teamChatThread');
    if(t1) t1.scrollTop = t1.scrollHeight;
  }, 30);
}
function getLastReadChatId(){
  try{ return parseInt(localStorage.getItem('sa_teamchat_last_read')||'0', 10) || 0; }catch(e){ return 0; }
}
function setLastReadChatId(id){
  try{ localStorage.setItem('sa_teamchat_last_read', String(id)); }catch(e){}
}

async function loadTeamChat(silent){
  const res = await apiPost('teamChatMessages', {});
  const msgs = res.messages || [];
  const newest = msgs.length ? msgs[msgs.length-1] : null;
  let unreadChanged = false;

  if(newest && newest.id > state.teamChatLastId){
    const isFirstCheck = state.teamChatLastId === 0;
    const sinceId = isFirstCheck ? getLastReadChatId() : state.teamChatLastId;
    const newOnes = msgs.filter(m=>m.id>sinceId && m.userId!==state.currentUser.id);
    if(newOnes.length>0){
      if(!isFirstCheck){
        playChatBeep();
        if(document.hidden) showBrowserNotification(newOnes[newOnes.length-1].userName, newOnes[newOnes.length-1].message);
      }
      if(!state.teamChatOpen){ state.teamChatUnreadCount = newOnes.length; unreadChanged = true; }
    }
    state.teamChatLastId = newest.id;
    if(state.teamChatOpen) setLastReadChatId(newest.id);
  }
  state.teamChat = msgs;
  if(!silent || state.teamChatOpen || unreadChanged){ safeRender(); if(state.teamChatOpen) scrollChatToBottom(); }
}
async function sendTeamChatMessage(message){
  const res = await apiPost('sendTeamChatMessage', { message });
  if(res.error){ showToast(res.error); return; }
  await loadTeamChat(false);
}
setInterval(()=>{ if(state.currentUser) loadTeamChat(true); }, 6000);
setInterval(()=>{ if(state.currentUser) loadUnreadNotifCount(); }, 20000);
document.addEventListener('click', (e)=>{
  if(state.notifDropdownOpen && !e.target.closest('.notif-bell-wrap')){
    state.notifDropdownOpen = false;
    render();
  }
});
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && state.currentUser) loadTeamChat(true); });


/* ---------------- ATTENDANCE ---------------- */
function todayRecord(userId){
  return state.attendance.find(a=>a.userId===userId && a.date===todayStr());
}
function getGeoCoords(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  });
}
async function checkIn(){
  state.checkingIn = true; render();
  const coords = await getGeoCoords();
  const res = await apiPost('checkIn', coords || {});

/* ---------------- WEBAUTHN (بصمة/Face ID حقيقية) ---------------- */
function webauthnSupported(){
  return !!(window.PublicKeyCredential && navigator.credentials);
}
function b64urlToBuffer(b64url){
  const pad = '='.repeat((4 - b64url.length % 4) % 4);
  const base64 = (b64url + pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  const buf = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) buf[i] = raw.charCodeAt(i);
  return buf.buffer;
}
function bufferToB64url(buf){
  const bytes = new Uint8Array(buf);
  let str = '';
  for(let i=0;i<bytes.length;i++) str += String.fromCharCode(bytes[i]);
  return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function registerBiometric(){
  if(!webauthnSupported()){ showToast('جهازك أو متصفحك لا يدعم البصمة الرقمية'); return; }
  try{
    const startRes = await apiPost('webauthnRegisterStart', {});
    if(startRes.error){ showToast(startRes.error); return; }
    const pk = startRes.publicKey;
    pk.challenge = b64urlToBuffer(pk.challenge);
    pk.user.id = b64urlToBuffer(pk.user.id);
    if(pk.excludeCredentials) pk.excludeCredentials.forEach(c => c.id = b64urlToBuffer(c.id));

    const cred = await navigator.credentials.create({ publicKey: pk });

    const finishRes = await apiPost('webauthnRegisterFinish', {
      clientDataJSON: bufferToB64url(cred.response.clientDataJSON),
      attestationObject: bufferToB64url(cred.response.attestationObject)
    });
    if(finishRes.error){ showToast(finishRes.error); return; }
    showToast('تم تفعيل البصمة الرقمية بنجاح 🔒');
    await refresh();
  }catch(e){
    showToast('تم إلغاء تفعيل البصمة أو حصل خطأ');
  }
}

async function verifyBiometricAndAttend(){
  if(!webauthnSupported()){ showToast('جهازك لا يدعم البصمة، استخدم زر الموقع العادي'); return; }
  state.checkingIn = true; render();
  try{
    const startRes = await apiPost('webauthnAuthStart', {});
    if(startRes.error){ state.checkingIn=false; render(); showToast(startRes.error); return; }
    const pk = startRes.publicKey;
    pk.challenge = b64urlToBuffer(pk.challenge);
    if(pk.allowCredentials) pk.allowCredentials.forEach(c => c.id = b64urlToBuffer(c.id));

    const assertion = await navigator.credentials.get({ publicKey: pk });
    const coords = await getGeoCoords();

    const res = await apiPost('webauthnAttendance', {
      id: bufferToB64url(assertion.rawId),
      clientDataJSON: bufferToB64url(assertion.response.clientDataJSON),
      authenticatorData: bufferToB64url(assertion.response.authenticatorData),
      signature: bufferToB64url(assertion.response.signature),
      lat: coords?.lat, lng: coords?.lng
    });
    state.checkingIn = false;
    if(res.error){ showToast(res.error); return; }
    showToast('تم التحقق بالبصمة وتسجيل دوامك ✅');
    await refresh();
  }catch(e){
    state.checkingIn = false; render();
    showToast('تم إلغاء التحقق بالبصمة');
  }
}

/* ---------------- DERIVED / REPORTS ---------------- */
function computeReport(userId, from, to){
  const att = state.attendance.filter(a=>a.userId===userId && a.date>=from && a.date<=to);
  const present = att.filter(a=>a.status==='present').length;
  const late = att.filter(a=>a.status==='late').length;
  const absent = att.filter(a=>a.status==='absent').length;
  const myTasks = state.tasks.filter(t=>t.assignees.some(a=>a.userId===userId));
  const doneOnAssignee = t=>t.assignees.find(a=>a.userId===userId).done;
  const completedInRange = myTasks.filter(t=>{
    const a = t.assignees.find(a=>a.userId===userId);
    return a.done && a.completedAt && a.completedAt.slice(0,10)>=from && a.completedAt.slice(0,10)<=to;
  }).length;
  const late_tasks = myTasks.filter(t=> !doneOnAssignee(t) && t.deadline && new Date(t.deadline)<new Date()).length;
  const pts = state.points.filter(p=>p.userId===userId && p.date.slice(0,10)>=from && p.date.slice(0,10)<=to).reduce((s,p)=>s+p.points,0);
  const u = state.users.find(u=>u.id===userId);
  const daysWithHours = att.filter(a=>a.checkIn && a.checkOut);
  const totalHours = Math.round(daysWithHours.reduce((s,a)=>s+(hoursDiff(a.checkIn,a.checkOut)||0),0)*10)/10;
  const requiredHours = Math.round((present+late) * expectedHours(u) * 10)/10;
  return { present, late, absent, totalTasks: myTasks.length, completed: completedInRange, late_tasks, points: pts, totalHours, requiredHours };
}
function thisMonthRange(){
  const d = new Date(); const y=d.getFullYear(), m=d.getMonth();
  const start = new Date(y,m,1).toISOString().slice(0,10);
  return { from: start, to: todayStr() };
}
function monthlyReport(userId){
  const {from,to} = thisMonthRange();
  return computeReport(userId, from, to);
}
function reportRangeFor(filter){
  const now = new Date();
  if(filter.preset==='today') return { from: todayStr(), to: todayStr() };
  if(filter.preset==='thisMonth') return thisMonthRange();
  if(filter.preset==='lastMonth'){
    const y=now.getFullYear(), m=now.getMonth();
    const start = new Date(y, m-1, 1).toISOString().slice(0,10);
    const end = new Date(y, m, 0).toISOString().slice(0,10);
    return { from:start, to:end };
  }
  return { from: filter.from || todayStr(), to: filter.to || todayStr() };
}
function leaderboard(monthKey){
  const m = monthKey || state.pointsMonth || currentMonthKey();
  return state.users.filter(u=>u.role==='employee').map(u=>({u, pts: userPoints(u.id, m)})).sort((a,b)=>b.pts-a.pts);
}

function monthlyCompletionSeries(){
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({label: d.toLocaleDateString('ar-EG',{month:'short'}), year: d.getFullYear(), month: d.getMonth()});
  }
  const data = months.map(m=>{
    let count = 0;
    state.tasks.forEach(t=>{
      if(t.assignees.some(a=>a.completedAt && new Date(a.completedAt).getFullYear()===m.year && new Date(a.completedAt).getMonth()===m.month)) count++;
    });
    return count;
  });
  return { labels: months.map(m=>m.label), data };
}

function weeklyProductivitySeries(){
  const days = [];
  for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push(d); }
  const toKey = d => d.toISOString().slice(0,10);
  const labels = days.map(d=>d.toLocaleDateString('ar-EG',{weekday:'short'}));
  const created = days.map(d=>{
    const k = toKey(d);
    return state.tasks.filter(t=>t.createdAt && t.createdAt.slice(0,10)===k).length;
  });
  const completed = days.map(d=>{
    const k = toKey(d);
    return state.tasks.filter(t=>t.assignees.some(a=>a.completedAt && a.completedAt.slice(0,10)===k)).length;
  });
  return { labels, created, completed };
}

// نسخة آمنة من render() تُستخدم بكل تحديث "خلفي" (Workload، عدّاد الإشعارات، Dashboard، الدردشة...)
// عشان ما تمسح محتوى أي نموذج مفتوح المستخدم عم يعبّيه بنفس اللحظة (مشكلة حقيقية اكتشفناها وأصلحناها)
function safeRender(){
  const activeForm = document.querySelector('#taskForm, #projectForm, #promptForm, #taskCommentForm, #webhookForm, #waForm');
  let snapshot = null;
  if(activeForm){
    snapshot = {};
    activeForm.querySelectorAll('input[name], textarea[name], select[name]').forEach(el=>{ snapshot[el.name] = el.value; });
  }
  render();
  if(snapshot){
    const freshForm = document.querySelector('#taskForm, #projectForm, #promptForm, #taskCommentForm, #webhookForm, #waForm');
    if(freshForm){
      freshForm.querySelectorAll('input[name], textarea[name], select[name]').forEach(el=>{
        if(snapshot[el.name] !== undefined) el.value = snapshot[el.name];
      });
    }
  }
}

function render(){
  const app = document.getElementById('app');
  if(state.loading){ app.innerHTML = `<div class="auth-wrap"><div style="color:var(--text-muted);font-weight:700;">جارِ التحميل…</div></div>`; return; }
  if(state.fatalError){
    app.innerHTML = `<div class="auth-wrap"><div class="auth-card"><div class="auth-error" style="margin-bottom:0;">${state.fatalError}</div><p class="auth-note">تأكد من إنشاء قاعدة البيانات واستيراد schema.sql، وتحديث بيانات الاتصال في ملف api/config.php.</p></div></div>`;
    return;
  }
  if(!state.hasUsers){ app.innerHTML = renderSetup(); attachSetupEvents(); return; }
  if(!state.currentUser){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  app.innerHTML = state.currentUser.role==='admin' ? renderAdmin() : renderEmployee();
  attachAppEvents();
}

  if(d.attendance.late.length>0) items.push({icon:'⏰', color:'var(--warning)', text:`${d.attendance.late.length} موظف متأخر اليوم`, sub:d.attendance.late.map(x=>x.userName).join('، '), tab:'attendance'});
  if(d.attendance.absent.length>0) items.push({icon:'❌', color:'var(--danger)', text:`${d.attendance.absent.length} موظف غائب حتى الآن`, sub:d.attendance.absent.map(x=>x.userName).join('، '), tab:'attendance'});
  if(d.tasks.overdue.length>0) items.push({icon:'🔴', color:'var(--danger)', text:`${d.tasks.overdue.length} مهمة متأخرة`, sub:d.tasks.overdue.slice(0,3).map(x=>x.title).join('، '), tab:'tasks'});
  if(d.tasks.dueToday.length>0) items.push({icon:'📅', color:'var(--warning)', text:`${d.tasks.dueToday.length} مهمة موعدها اليوم`, sub:d.tasks.dueToday.slice(0,3).map(x=>x.title).join('، '), tab:'tasks'});
  if(d.tasks.readyForReview.length>0) items.push({icon:'🟣', color:'#6B3FD1', text:`${d.tasks.readyForReview.length} مهمة بانتظار مراجعتك`, sub:d.tasks.readyForReview.slice(0,3).map(x=>x.title).join('، '), tab:'tasks'});
  if(d.tasks.changesRequested.length>0) items.push({icon:'🟡', color:'var(--warning)', text:`${d.tasks.changesRequested.length} مهمة طُلب تعديلها`, sub:d.tasks.changesRequested.slice(0,3).map(x=>x.title).join('، '), tab:'tasks'});
  if(d.leaveRequests.pending.length>0) items.push({icon:'🏖️', color:'var(--warning)', text:`${d.leaveRequests.pending.length} طلب إجازة بانتظار المراجعة`, sub:d.leaveRequests.pending.map(x=>x.userName).join('، '), tab:'attendance'});
  if(d.financial && (d.financial.dueTodayCount>0 || d.financial.overdueCount>0)) {
    items.push({icon:'💰', color:'var(--danger)', text:`مطالبات مالية تحتاج متابعة: ${d.financial.dueTodayCount} اليوم، ${d.financial.overdueCount} متأخرة`, sub:`إجمالي متأخر: ${d.financial.overdueAmount.toLocaleString()}`, tab:'claims'});
  }
  if(d.whatsapp && d.whatsapp.conversationsNeedingReply>0) items.push({icon:'💬', color:'var(--warning)', text:`${d.whatsapp.conversationsNeedingReply} محادثة واتساب تحتاج ردًا`, sub:'', tab:'inbox'});

  return `
  <div class="card" style="margin-bottom:16px;">
    <div class="section-title">🎯 يحتاج انتباهك اليوم ${items.length>0?`<span class="badge badge-danger">${items.length}</span>`:''}</div>
    ${items.length===0?`<div class="empty">كل شي تمام، لا يوجد شي يحتاج انتباهك حاليًا 🎉</div>`:`
    <div class="attention-grid">
      ${items.map(it=>`
        <div class="attention-item" data-tab="${it.tab}">
          <span class="attention-icon" style="background:${it.color}1a;color:${it.color};">${it.icon}</span>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;font-size:13px;">${it.text}</div>
            ${it.sub?`<div style="font-size:11px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${it.sub}</div>`:''}
          </div>
        </div>`).join('')}
    </div>`}
  </div>`;
}

function adminDashboard(){
  const employees = state.users.filter(u=>u.role==='employee');
  const todayRecs = state.attendance.filter(a=>a.date===todayStr());
  const present = todayRecs.filter(a=>a.status==='present').length;
  const late = todayRecs.filter(a=>a.status==='late').length;
  const noRecord = employees.length - todayRecs.length;

  const now = new Date();
  const weekAgo = new Date(now - 7*86400000);
  const twoWeeksAgo = new Date(now - 14*86400000);

  const doneTasks = state.tasks.filter(t=>taskStatus(t)==='done');
  const progressTasks = state.tasks.filter(t=>['new','in_progress'].includes(taskStatus(t)));
  const lateTasks = state.tasks.filter(t=>taskStatus(t)==='late');
  const totalTasks = state.tasks.length;

  const doneThisWeek = doneTasks.filter(t=>t.assignees.some(a=>a.completedAt && new Date(a.completedAt)>=weekAgo)).length;
  const doneLastWeek = doneTasks.filter(t=>t.assignees.some(a=>a.completedAt && new Date(a.completedAt)>=twoWeeksAgo && new Date(a.completedAt)<weekAgo)).length;
  const trend = (curr, prev) => {
    if(prev===0) return curr>0 ? {dir:'up', text:'جديد'} : {dir:'flat', text:'—'};
    const pct = Math.round(((curr-prev)/prev)*100);
    return pct>=0 ? {dir:'up', text:`+${pct}%`} : {dir:'down', text:`${pct}%`};
  };
  const tTrend = trend(doneThisWeek, doneLastWeek);
  const completionRate = totalTasks ? Math.round((doneTasks.length/totalTasks)*100) : 0;

  const top = leaderboard().slice(0,3);
  const recentActivity = state.notifications.slice(0,6);
  const pendingLeaves = (state.leaveRequests||[]).filter(l=>l.status==='pending');

  return `
  ${executiveAttentionSection()}
  ${pendingLeaves.length>0?`
  <div class="whatsapp-banner" style="background:var(--warning-tint);border-color:rgba(217,121,26,0.3);color:#8A4E0E;cursor:pointer;" id="pendingLeavesBanner">
    🏖️ <div style="flex:1;"><b>${pendingLeaves.length} طلب إجازة بانتظار المراجعة:</b>
      ${pendingLeaves.slice(0,3).map(l=>{const u=state.users.find(u=>u.id===l.userId);return u?u.name:'';}).join('، ')}${pendingLeaves.length>3?` +${pendingLeaves.length-3} آخرين`:''}
      — دوس هنا للمراجعة من تبويب "الدوام"
    </div>
  </div>` : ''}
  <div class="grid grid-4" style="margin-bottom:16px;">
    <div class="card stat-card stat-card-v2">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="stat-icon" style="background:var(--success-tint);color:var(--success);">✓</div>
        <span class="stat-trend ${tTrend.dir}">${tTrend.dir==='up'?'▲':tTrend.dir==='down'?'▼':''} ${tTrend.text}</span>
      </div>
      <div><div class="stat-value">${doneTasks.length}</div><div class="stat-label" style="margin-bottom:0;">تم إنجازها</div></div>
    </div>
    <div class="card stat-card stat-card-v2">
      <div class="stat-icon" style="background:var(--warning-tint);color:var(--warning);">⏳</div>
      <div><div class="stat-value">${progressTasks.length}</div><div class="stat-label" style="margin-bottom:0;">قيد التنفيذ</div></div>
    </div>
    <div class="card stat-card stat-card-v2">
      <div class="stat-icon" style="background:var(--danger-tint);color:var(--danger);">⚠️</div>
      <div><div class="stat-value">${lateTasks.length}</div><div class="stat-label" style="margin-bottom:0;">متأخرة</div></div>
    </div>
    <div class="card stat-card stat-card-v2">
      <div class="stat-icon" style="background:var(--primary-tint);color:var(--primary);">📋</div>
      <div><div class="stat-value">${totalTasks}</div><div class="stat-label" style="margin-bottom:0;">إجمالي المهام</div></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <div class="section-title">معدل الإنجاز الكلي <span class="badge badge-primary">${completionRate}%</span></div>
    <div style="background:var(--surface-2);border-radius:100px;height:10px;overflow:hidden;">
      <div style="background:var(--accent);height:100%;width:${completionRate}%;border-radius:100px;"></div>
    </div>
  </div>

  <div class="section-title" style="margin-bottom:12px;">لوحة المهام</div>
  <div class="kanban-wrap" style="margin-bottom:16px;">
    ${kanbanColumn('قيد التنفيذ', progressTasks, 'var(--warning-tint)', 'var(--warning)')}
    ${kanbanColumn('متأخرة', lateTasks, 'var(--danger-tint)', 'var(--danger)')}
    ${kanbanColumn('مكتملة', doneTasks, 'var(--success-tint)', 'var(--success)')}
  </div>

  <div class="grid grid-2" style="margin-bottom:16px;">
    <div class="card">
      <div class="section-title">📈 نمو وإنجاز المهام الشهري</div>
      <p style="font-size:11px;color:var(--text-faint);margin-top:-6px;margin-bottom:10px;">معدل إغلاق وتسليم المهام خلال آخر 6 أشهر</p>
      <div style="height:230px;"><canvas id="monthlyChart"></canvas></div>
    </div>
    <div class="card">
      <div class="section-title">📊 إنتاجية المهام الأسبوعية</div>
      <p style="font-size:11px;color:var(--text-faint);margin-top:-6px;margin-bottom:10px;">مقارنة بين المهام الجديدة والمنجزة خلال آخر 7 أيام</p>
      <div style="height:230px;"><canvas id="weeklyChart"></canvas></div>
    </div>
  </div>

  <div class="grid grid-3">
    <div class="card">
      <div class="section-title">⚡ النشاط المباشر</div>
      ${recentActivity.length===0?`<div class="empty">ما في نشاط بعد</div>`:recentActivity.map(n=>{
        const u = state.users.find(u=>u.id===n.userId);
        return `<div class="activity-item"><div class="activity-dot"></div><div><div class="activity-text"><b>${u?u.name:''}</b> — ${n.message}</div><div class="activity-time">${timeAgo(n.createdAt)}</div></div></div>`;
      }).join('')}
    </div>
    <div class="card">
      <div class="section-title">🏆 الموظفون الأكثر إنتاجية</div>
      ${top.length===0?`<div class="empty">لا توجد نقاط بعد</div>`:top.map((t,i)=>`
        <div style="display:flex;align-items:center;gap:10px;padding:9px 0;${i<top.length-1?'border-bottom:1px solid var(--border);':''}">
          <div class="rank-pill">${i+1}</div>
          <div class="avatar" style="width:30px;height:30px;font-size:12px;">${t.u.name[0]}</div>
          <div style="flex:1;font-weight:700;font-size:13.5px;">${t.u.name}</div>
          <div style="font-weight:800;color:var(--primary);">${t.pts}</div>
        </div>`).join('')}
    </div>
    <div class="card">
      <div class="section-title">حالة الفريق اليوم</div>
      ${employees.length===0?`<div class="empty">لا يوجد موظفون بعد.</div>`:`
      ${employees.slice(0,6).map(e=>{
        const r = todayRecs.find(a=>a.userId===e.id);
        return `<div class="assignee-row"><span>${e.name}</span>${r?statusBadge(r.status):'<span class="badge badge-muted">لم يسجل</span>'}</div>`;
      }).join('')}
      <p style="font-size:11.5px;color:var(--text-faint);margin-top:10px;">${present} حاضر / ${late} متأخر / ${noRecord} لم يسجل</p>`}
    </div>
  </div>`;
}

function taskFilterTabs(list){
  const tab = state.taskFilterTab || 'active';
  const counts = {
    active: list.filter(t=>taskStatus(t)!=='done').length,
    all: list.length,
    new: list.filter(t=>taskStatus(t)==='new').length,
    in_progress: list.filter(t=>taskStatus(t)==='in_progress').length,
    ready_for_review: list.filter(t=>taskStatus(t)==='ready_for_review').length,
    changes_requested: list.filter(t=>taskStatus(t)==='changes_requested').length,
    done: list.filter(t=>taskStatus(t)==='done').length,
    late: list.filter(t=>taskStatus(t)==='late').length,
  };
  const tabs = [
    {key:'active', label:'⚡ النشطة'},
    {key:'late', label:'🔴 متأخرة'},
    {key:'new', label:'🟠 لم تُستلم'},
    {key:'in_progress', label:'🔵 قيد التجهيز'},
    {key:'ready_for_review', label:'🟣 بانتظار المراجعة'},
    {key:'changes_requested', label:'🟡 تحتاج تعديل'},
    {key:'done', label:'🟢 منجزة'},
    {key:'all', label:'الكل'},
  ];
  return `<div class="subtab-nav">${tabs.map(x=>`<button class="subtab-btn ${tab===x.key?'active':''}" data-task-filter="${x.key}">${x.label} (${counts[x.key]})</button>`).join('')}</div>`;
}
function filterTasksByTab(list){
  const tab = state.taskFilterTab || 'active';
  let filtered;
  if(tab==='all') filtered = list;
  else if(tab==='active') filtered = list.filter(t=>taskStatus(t)!=='done'); // كل شي مش منجز
  else filtered = list.filter(t=>taskStatus(t)===tab);
  return sortTasksByUrgency(filtered);
}
// ترتيب حسب الإلحاح: المتأخرة أولاً، ثم مستحقة اليوم، ثم الأقرب موعدًا، والمنجزة بالآخر دايمًا
function sortTasksByUrgency(list){
  const rank = (t)=>{
    const s = taskStatus(t);
    if(s==='done') return 5;
    if(s==='late') return 0;
    if(t.deadline && t.deadline.slice(0,10)===todayStr()) return 1;
    if(s==='changes_requested') return 2;
    if(s==='ready_for_review') return 3;
    return 4;
  };
  return [...list].sort((a,b)=>{
    const r = rank(a) - rank(b);
    if(r!==0) return r;
    if(a.deadline && b.deadline) return a.deadline.localeCompare(b.deadline); // الأقرب موعدًا أولاً
    if(a.deadline) return -1;
    if(b.deadline) return 1;
    return 0;
  });
}

function daysLeftText(deadline, done){
  if(!deadline || done) return '';
  const diff = Math.ceil((new Date(deadline) - new Date(todayStr()))/86400000);
  if(diff < 0) return `<span style="color:var(--danger);font-weight:700;">متأخرة ${Math.abs(diff)} يوم</span>`;
  if(diff === 0) return `<span style="color:var(--warning);font-weight:700;">مستحقة اليوم</span>`;
  return `<span style="color:var(--text-faint);">متبقي ${diff} يوم</span>`;
}

  return `
  <div id="attachmentsList-${entityType}-${entityId}">
    ${items.length===0?`<div class="empty" style="padding:16px;">لا توجد مرفقات بعد</div>`:`

      <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface-2);border-radius:8px;">

        <div style="flex:1;min-width:0;">
          <a href="${a.filePath||a.linkUrl}" target="_blank" style="font-size:12.5px;font-weight:700;color:var(--primary);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;">${a.fileName}</a>
          <div style="font-size:10.5px;color:var(--text-faint);">${a.uploaderName||''} · ${fmtDateTime(a.createdAt)}${a.versionLabel?` · ${a.versionLabel}`:''}</div>

    <input type="file" name="file" style="flex:1;min-width:160px;font-size:12.5px;"/>
    <input type="text" name="linkUrl" placeholder="أو الصق رابط خارجي (Google Drive...)" style="flex:1;min-width:160px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface-2);font-size:12.5px;"/>

}
function taskStatusLogHtml(){
  const log = state.taskStatusLog || [];
  if(log.length===0) return `<div class="empty">لا يوجد سجل بعد</div>`;
  const labels = {new:'جديدة', in_progress:'قيد التجهيز', ready_for_review:'بانتظار المراجعة', changes_requested:'تحتاج تعديل', done:'منجزة'};
  return log.map(l=>`
    <div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:12px;">
      <span style="color:var(--text-faint);white-space:nowrap;">${fmtDateTime(l.createdAt)}</span>
      <span>${l.userName||'—'} غيّر الحالة من <b>${labels[l.fromStatus]||l.fromStatus||'—'}</b> إلى <b>${labels[l.toStatus]||l.toStatus}</b>${l.note?`<br><span style="color:var(--text-muted);">"${l.note}"</span>`:''}</span>
    </div>`).join('');
}

function hoursDiff(t1, t2){
  if(!t1 || !t2) return null;
  const [h1,m1] = t1.split(':').map(Number);
  const [h2,m2] = t2.split(':').map(Number);
  return Math.round(((h2*60+m2)-(h1*60+m1))/6)/10;
}
function expectedHours(u){
  return hoursDiff(u?.workStart||'08:00', u?.workEnd||'16:00') || 8;
}

}

      <span style="margin-right:auto;font-size:11.5px;color:var(--text-faint);">📅 ${fmtDate(range.from)} — ${fmtDate(range.to)}</span>
    </div>
  </div>
  <div class="subtab-nav">
    ${tabs.map(t=>`<button class="subtab-btn ${tab===t.key?'active':''}" data-reports-tab="${t.key}">${t.label}</button>`).join('')}
  </div>
  ${tab==='overview'?reportsOverview():''}
  ${tab==='employees'?reportsEmployees():''}
  ${tab==='tasks'?reportsTasks():''}
  ${tab==='points'?reportsPoints():''}
  ${tab==='clients'?reportsClients():''}
  `;
}

function reportsOverview(){
  const employees = state.users.filter(u=>u.role==='employee');
  const range = reportRangeFor(state.reportFilter);
  const start = new Date(range.from+'T00:00:00'), end = new Date(range.to+'T23:59:59');
  const doneTasks = state.tasks.filter(t=>taskStatus(t)==='done');
  const lateTasks = state.tasks.filter(t=>taskStatus(t)==='late');
  const completionRate = state.tasks.length ? Math.round((doneTasks.length/state.tasks.length)*100) : 0;
  const monthPoints = state.points.filter(p=>new Date(p.date)>=start && new Date(p.date)<=end);
  const pointsIssued = monthPoints.filter(p=>p.points>0).reduce((s,p)=>s+p.points,0);
  const pointsDeducted = monthPoints.filter(p=>p.points<0).reduce((s,p)=>s+p.points,0);
  const totalHours = employees.reduce((s,e)=>s+computeReport(e.id, range.from, range.to).totalHours,0);
  const requiredHours = employees.reduce((s,e)=>s+computeReport(e.id, range.from, range.to).requiredHours,0);
  return `
  <div class="grid grid-4" style="margin-bottom:16px;">
    <div class="card stat-card"><div class="stat-label">عدد الموظفين</div><div class="stat-value">${employees.length}</div></div>
    <div class="card stat-card"><div class="stat-label">معدل إنجاز المهام</div><div class="stat-value" style="color:var(--success)">${completionRate}%</div></div>
    <div class="card stat-card"><div class="stat-label">مهام متأخرة حاليًا</div><div class="stat-value" style="color:var(--danger)">${lateTasks.length}</div></div>
    <div class="card stat-card"><div class="stat-label">ساعات العمل بالفترة المحددة</div><div class="stat-value" style="color:${totalHours>=requiredHours?'var(--success)':'var(--warning)'}">${Math.round(totalHours)}<span style="font-size:13px;color:var(--text-faint);">/${Math.round(requiredHours)}س</span></div></div>
  </div>
  <div class="grid grid-2">
    <div class="card">
      <div class="section-title">نقاط الفترة المحددة</div>
      <div class="assignee-row"><span>نقاط مكتسبة</span><b style="color:var(--success)">+${pointsIssued}</b></div>
      <div class="assignee-row"><span>نقاط مخصومة</span><b style="color:var(--danger)">${pointsDeducted}</b></div>
      <div class="assignee-row"><span>الصافي</span><b style="color:var(--primary)">${pointsIssued+pointsDeducted}</b></div>
    </div>
    <div class="card">
      <div class="section-title">حالة المهام</div>
      <div class="assignee-row"><span>مكتملة</span><span class="badge badge-success">${doneTasks.length}</span></div>
      <div class="assignee-row"><span>قيد التنفيذ</span><span class="badge badge-primary">${state.tasks.filter(t=>['new','in_progress'].includes(taskStatus(t))).length}</span></div>
      <div class="assignee-row"><span>متأخرة</span><span class="badge badge-danger">${lateTasks.length}</span></div>
    </div>
  </div>`;
}

function reportsEmployees(){
  const employees = state.users.filter(u=>u.role==='employee');
  const range = reportRangeFor(state.reportFilter);
  return `
  <div class="card">
    <div class="section-title">تقرير الموظفين — ${fmtDate(range.from)} إلى ${fmtDate(range.to)}</div>
    ${employees.length===0?`<div class="empty">لا يوجد موظفون بعد</div>`:`
    <table><thead><tr><th>الموظف</th><th>حاضر</th><th>متأخر</th><th>غائب</th><th>الساعات الفعلية</th><th>الساعات المطلوبة</th><th>مهام منجزة</th><th>النقاط</th></tr></thead><tbody>
    ${employees.map(e=>{ const r = computeReport(e.id, range.from, range.to);
      const shortfall = r.totalHours < r.requiredHours;
      return `<tr><td>${e.name}</td><td>${r.present}</td><td>${r.late}</td><td>${r.absent}</td>
        <td style="color:${shortfall?'var(--warning)':'var(--success)'};font-weight:700;">${r.totalHours}س</td>
        <td style="color:var(--text-faint);">${r.requiredHours}س</td>
        <td>${r.completed}/${r.totalTasks}</td><td><span class="badge badge-primary">${r.points}</span></td></tr>`;
    }).join('')}
    </tbody></table>`}
  </div>`;
}

function reportsTasks(){
  const byStatus = { done: state.tasks.filter(t=>taskStatus(t)==='done'), progress: state.tasks.filter(t=>['new','in_progress'].includes(taskStatus(t))), late: state.tasks.filter(t=>taskStatus(t)==='late') };
  const byPriority = { high: state.tasks.filter(t=>t.priority==='high').length, medium: state.tasks.filter(t=>t.priority==='medium').length, low: state.tasks.filter(t=>t.priority==='low').length };
  return `
  <div class="grid grid-2" style="margin-bottom:16px;">
    <div class="card">
      <div class="section-title">توزيع الأولويات</div>
      <div class="assignee-row"><span>عالية</span><span class="badge badge-danger">${byPriority.high}</span></div>
      <div class="assignee-row"><span>متوسطة</span><span class="badge badge-warning">${byPriority.medium}</span></div>
      <div class="assignee-row"><span>منخفضة</span><span class="badge badge-muted">${byPriority.low}</span></div>
    </div>
    <div class="card">
      <div class="section-title">توزيع الحالات</div>
      <div class="assignee-row"><span>مكتملة</span><span class="badge badge-success">${byStatus.done.length}</span></div>
      <div class="assignee-row"><span>قيد التنفيذ</span><span class="badge badge-primary">${byStatus.progress.length}</span></div>
      <div class="assignee-row"><span>متأخرة</span><span class="badge badge-danger">${byStatus.late.length}</span></div>
    </div>
  </div>
  <div class="card">
    <div class="section-title">المهام المتأخرة حاليًا</div>
    ${byStatus.late.length===0?`<div class="empty">لا توجد مهام متأخرة 🎉</div>`:`
    <table><thead><tr><th>المهمة</th><th>الموظفون</th><th>الموعد</th></tr></thead><tbody>
    ${byStatus.late.map(t=>`<tr><td>${t.title}</td><td>${t.assignees.map(a=>state.users.find(u=>u.id===a.userId)?.name).join('، ')}</td><td style="color:var(--danger)">${fmtDate(t.deadline)}</td></tr>`).join('')}
    </tbody></table>`}
  </div>`;
}

function reportsPoints(){
  const range = reportRangeFor(state.reportFilter);
  const start = new Date(range.from+'T00:00:00'), end = new Date(range.to+'T23:59:59');
  const monthPoints = state.points.filter(p=>new Date(p.date)>=start && new Date(p.date)<=end).sort((a,b)=>new Date(b.date)-new Date(a.date));
  // الصدارة تُحسب من نفس نطاق الفلتر المختار بالضبط (مو الشهر الحالي دايمًا)
  const rangeLeaderboard = state.users.filter(u=>u.role==='employee')
    .map(u=>({u, pts: monthPoints.filter(p=>p.userId===u.id).reduce((s,p)=>s+p.points,0)}))
    .sort((a,b)=>b.pts-a.pts);
  return `
  <div class="grid grid-2">
    <div class="card">
      <div class="section-title">🏆 لوحة الصدارة <span style="font-size:11px;color:var(--text-faint);font-weight:600;">${fmtDate(range.from)} — ${fmtDate(range.to)}</span></div>
      ${rangeLeaderboard.map((t,i)=>`
        <div class="assignee-row"><span>${i+1}. ${t.u.name}</span><b style="color:var(--primary)">${t.pts}</b></div>`).join('') || `<div class="empty">لا يوجد بعد</div>`}
    </div>
    <div class="card">
      <div class="section-title">سجل نقاط الفترة المحددة</div>
      <div style="max-height:400px;overflow-y:auto;">
      ${monthPoints.length===0?`<div class="empty">لا يوجد سجل بعد</div>`:monthPoints.map(p=>{
        const u = state.users.find(u=>u.id===p.userId);
        return `<div class="assignee-row"><span>${u?u.name:''} — ${p.reason}</span><b style="color:${p.points>=0?'var(--success)':'var(--danger)'}">${p.points>0?'+':''}${p.points}</b></div>`;
      }).join('')}
      </div>
    </div>
  </div>`;
}

function reportsClients(){
  const clients = state.clients||[];
  return `
  <div class="card">
    <div class="section-title">المهام حسب الشركة/العميل</div>
    ${clients.length===0?`<div class="empty">لا يوجد عملاء بعد</div>`:`
    <table><thead><tr><th>الشركة</th><th>إجمالي المهام</th><th>مكتملة</th><th>قيد التنفيذ</th></tr></thead><tbody>
    ${clients.map(c=>{
      const tasks = state.tasks.filter(t=>t.clientId==c.id);
      const done = tasks.filter(t=>taskStatus(t)==='done').length;
      return `<tr><td>${c.name}</td><td>${tasks.length}</td><td><span class="badge badge-success">${done}</span></td><td><span class="badge badge-primary">${tasks.length-done}</span></td></tr>`;
    }).join('')}
    </tbody></table>`}
  </div>`;
}

function empClaims(){
  const claims = (state.claims||[]).filter(c=>Math.max(0, c.amount-c.paidAmount) > 0);
  const claimStatusMap = {paid:['مدفوعة','badge-success'], due:['مستحقة','badge-warning'], overdue:['متأخرة','badge-danger']};
  return `
  <div class="card">
    <div class="section-title">المطالبات المستحقة (${claims.length})</div>
    ${claims.length===0?`<div class="empty">لا توجد مطالبات مستحقة حاليًا 🎉</div>`:`
    <div style="overflow-x:auto;">
    <table><thead><tr><th>المدين</th><th>الوصف</th><th>المتبقي</th><th>الاستحقاق</th><th>الحالة</th><th></th></tr></thead><tbody>
    ${claims.map(c=>{
      const remaining = Math.round((c.amount-c.paidAmount)*100)/100;
      const [label,cls] = claimStatusMap[claimStatus(c)];
      return `<tr>
        <td>${c.debtorName}${c.debtorPhone?`<div style="font-size:10.5px;color:var(--text-faint);" dir="ltr">${c.debtorPhone}</div>`:''}</td>
        <td style="font-size:11.5px;color:var(--text-muted);">${c.description||'—'}</td>
        <td style="font-weight:700;color:var(--danger);">${remaining.toLocaleString()}</td>
        <td style="font-size:11.5px;">${c.dueDate?fmtDate(c.dueDate):'—'}</td>
        <td><span class="badge ${cls}">${label}</span></td>
        <td>${c.debtorPhone?`<button class="btn btn-primary btn-sm" data-send-reminder="${c.id}" style="width:auto;">📱 تذكير</button>`:'<span style="font-size:11px;color:var(--text-faint);">بدون رقم</span>'}</td>
      </tr>`;
    }).join('')}
    </tbody></table>
    </div>`}
  </div>`;
}

function claimStatus(c){
  const remaining = Math.round((c.amount - c.paidAmount)*100)/100;
  if(remaining<=0) return 'paid';
  if(c.dueDate && new Date(c.dueDate) < new Date()) return 'overdue';
  return 'due';
}
function adminClaims(){
  const claims = state.claims||[];
  const totalDue = claims.reduce((s,c)=>s+Math.max(0,c.amount-c.paidAmount),0);
  const overdueCount = claims.filter(c=>claimStatus(c)==='overdue').length;
  const {from,to} = thisMonthRange();
  const collectedThisMonth = claims.reduce((s,c)=>s+ (c.createdAt.slice(0,10)>=from && c.createdAt.slice(0,10)<=to ? (+c.paidAmount) : 0),0);
  const claimStatusMap = {paid:['مدفوعة','badge-success'], due:['مستحقة','badge-warning'], overdue:['متأخرة','badge-danger']};

  return `
  <div class="grid grid-3" style="margin-bottom:16px;">
    <div class="card stat-card"><div class="stat-label">إجمالي المستحق على العملاء</div><div class="stat-value" style="color:var(--danger)">${totalDue.toLocaleString()}</div></div>
    <div class="card stat-card"><div class="stat-label">مطالبات متأخرة</div><div class="stat-value" style="color:var(--danger)">${overdueCount}</div></div>
    <div class="card stat-card"><div class="stat-label">محصّل هذا الشهر</div><div class="stat-value" style="color:var(--success)">${collectedThisMonth.toLocaleString()}</div></div>
  </div>
  <div class="section-title">قائمة المطالبات (${claims.length}) ${state.claimModal?'':'<button class="btn btn-primary btn-sm" id="openClaimModal">+ مطالبة جديدة</button>'}</div>
  ${state.claimModal ? claimForm() : ''}
  ${claims.length===0?`<div class="card"><div class="empty">لا توجد مطالبات مالية بعد.</div></div>`:`
  <div class="card">
    <div style="overflow-x:auto;">
    <table><thead><tr><th>المدين</th><th>الوصف</th><th>المبلغ</th><th>المدفوع</th><th>المتبقي</th><th>الاستحقاق</th><th>الحالة</th><th></th></tr></thead><tbody>
    ${claims.map(c=>{
      const remaining = Math.round((c.amount-c.paidAmount)*100)/100;
      const [label,cls] = claimStatusMap[claimStatus(c)];
      return `<tr>
        <td>${c.debtorName}${c.debtorPhone?`<div style="font-size:10.5px;color:var(--text-faint);" dir="ltr">${c.debtorPhone}</div>`:''}</td>
        <td style="font-size:11.5px;color:var(--text-muted);max-width:160px;">${c.description||'—'}</td>
        <td>${(+c.amount).toLocaleString()}</td>
        <td style="color:var(--success);">${(+c.paidAmount).toLocaleString()}</td>
        <td style="font-weight:700;color:${remaining>0?'var(--danger)':'var(--success)'};">${remaining.toLocaleString()}</td>
        <td style="font-size:11.5px;">${c.dueDate?fmtDate(c.dueDate):'—'}</td>
        <td><span class="badge ${cls}">${label}</span></td>
        <td style="min-width:190px;">
          <div class="claim-actions">
            ${remaining>0?`<button class="btn btn-ghost btn-sm claim-action-btn" data-add-payment="${c.id}">💰 دفعة</button>`:''}
            ${remaining>0 && c.debtorPhone?`<button class="btn btn-primary btn-sm claim-action-btn" style="width:auto;" data-send-reminder="${c.id}">📱 تذكير</button>`:''}
            <button class="btn btn-ghost btn-sm claim-action-btn" data-view-reminder-log="${c.id}">📜 أرشيف</button>
            <button class="btn btn-danger btn-sm claim-action-btn" data-remove-claim="${c.id}">🗑️ حذف</button>
          </div>
        </td>
      </tr>`;
    }).join('')}
    </tbody></table>
    </div>
  </div>`}
  ${state.claimReminderLogFor ? claimReminderLogModal() : ''}`;
}

function claimReminderLogModal(){
  const log = state.claimReminderLog || [];
  return `<div class="modal-bg" id="reminderLogModalBg"><div class="modal">
    <h3 class="modal-title">📜 أرشيف رسائل التذكير</h3>

function notificationsList(all){

  const unreadMine = mine.filter(n=>!n.isRead).length;
  return `<div class="card">
    ${whatsappBanner()}
    ${!all && unreadMine>0?`<div style="margin-bottom:12px;"><button type="button" id="markAllReadBtnFull" class="btn btn-ghost btn-sm">تحديد الكل كمقروء (${unreadMine})</button></div>`:''}
    ${list.length===0?`<div class="empty">لا توجد إشعارات حتى الآن</div>`:list.slice(0,80).map(n=>{
      const u = state.users.find(u=>u.id===n.userId);
      const clickable = !all && (n.entityType==='task'||n.entityType==='project'||n.entityType==='leave');
      return `<div class="notif-item ${!all && !n.isRead?'unread':''} ${clickable?'clickable':''}" ${clickable?`data-open-notif="${n.id}|${n.entityType||''}|${n.entityId||''}"`:''}>

        <div style="flex:1;"><div class="notif-text">${all?`<b>${u?u.name:''}:</b> `:''}${n.title?`<b>${n.title}</b> — `:''}${n.message}</div><div class="notif-time">${fmtDateTime(n.createdAt)}</div></div>
        ${!all && !n.isRead?'<span class="notif-unread-dot"></span>':''}

    }).join('')}
  </div>`;
}

function attendanceCard(rec){
  const u = state.currentUser;
  const exp = expectedHours(u);
  const bioReady = webauthnSupported() && u.hasWebauthn;
  const bioSupported = webauthnSupported();
  let body;
  if(!rec){
    body = `
      <button class="fingerprint-circle" id="${bioReady?'bioAttendBtn':'checkInBtn'}" ${state.checkingIn?'disabled':''}>
        ${FINGERPRINT_SVG}
        <span style="font-size:10.5px;font-weight:700;">${state.checkingIn?'جارِ التحقق...':(bioReady?'اضغط للتحقق بالبصمة':'اضغط لتسجيل الحضور')}</span>
      </button>
      <div class="auth-error" style="margin-bottom:0;">لم تقم بتسجيل حضورك اليوم حتى الآن. يرجى الضغط فور بدء العمل الفعلي.</div>`;
  } else if(!rec.checkOut){
    body = `
      <div style="text-align:center;margin-bottom:6px;">${statusBadge(rec.status)} <span style="color:var(--text-muted);font-size:12.5px;">حضرت الساعة ${rec.checkIn}</span></div>
      <button class="fingerprint-circle" id="${bioReady?'bioAttendBtn':'checkOutBtn'}" style="border-color:var(--accent);color:var(--accent);" ${state.checkingIn?'disabled':''}>
        ${FINGERPRINT_SVG}
        <span style="font-size:10.5px;font-weight:700;">${state.checkingIn?'جارِ التحقق...':(bioReady?'اضغط للتحقق بالبصمة':'اضغط لتسجيل الانصراف')}</span>
      </button>`;
  } else {
    const worked = hoursDiff(rec.checkIn, rec.checkOut);
    body = `<div style="text-align:center;padding:14px 0;">
      <div style="font-size:36px;margin-bottom:6px;">✅</div>
      <div style="font-weight:800;font-size:13.5px;">تم تسجيل دوامك بالكامل لليوم</div>
      <div style="color:${worked>=exp?'var(--success)':'var(--warning)'};font-weight:800;margin-top:8px;font-size:15px;">${worked} من أصل ${exp} ساعة</div>
    </div>`;
  }
  return `
  <div class="card">
    <div class="section-title">بصمة الحضور والانصراف الرقمية</div>
    <p style="font-size:11.5px;color:var(--text-muted);margin-top:-8px;margin-bottom:14px;">${bioReady?'تسجيل الدوام بالتحقق ببصمتك أو Face ID الحقيقي':'تسجيل الدوام مع التحقق من الموقع الجغرافي الفعلي'}</p>
    <div class="welcome-panel">
      <div>أهلًا بك، <b>${u.name}</b></div>
      <div style="color:var(--text-muted);margin-top:4px;">القسم: ${u.department} · الدوام المعتمد: <span dir="ltr">${(u.workStart||'').slice(0,5)} – ${(u.workEnd||'').slice(0,5)}</span></div>
    </div>
    ${body}
    ${bioSupported && !u.hasWebauthn ? `
    <div style="text-align:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);">
      <p style="font-size:11.5px;color:var(--text-muted);margin-bottom:8px;">فعّل البصمة الرقمية لجهازك عشان تسجيل الدوام يصير أسرع وأأمن</p>
      <button class="btn btn-ghost btn-sm" id="registerBioBtn">🔒 تفعيل البصمة الرقمية</button>
    </div>` : ''}
    ${u.hasWebauthn ? `<p style="text-align:center;font-size:10.5px;color:var(--success);margin-top:10px;">🔒 البصمة الرقمية مفعّلة على هذا الحساب</p>` : ''}
  </div>`;
}

function empAttendance(){
  const mine = state.attendance.filter(a=>a.userId===state.currentUser.id).sort((a,b)=>b.date.localeCompare(a.date));
  const exp = expectedHours(state.currentUser);
  const myLeaves = (state.leaveRequests||[]).slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const leaveStatusMap = {pending:['قيد المراجعة','badge-warning'], approved:['موافَق عليها','badge-success'], rejected:['مرفوضة','badge-danger']};
  return `
  <div class="card" style="margin-bottom:16px;">
    <div class="section-title">طلبات إجازتي <button class="btn btn-primary btn-sm" id="openLeaveModal">+ طلب إجازة</button></div>
    ${myLeaves.length===0?`<div class="empty">ما في طلبات إجازة قدّمتها بعد</div>`:`
    <table><thead><tr><th>من</th><th>إلى</th><th>السبب</th><th>الحالة</th></tr></thead><tbody>
    ${myLeaves.map(l=>{ const [label,cls] = leaveStatusMap[l.status];
      return `<tr><td>${fmtDate(l.startDate)}</td><td>${fmtDate(l.endDate)}</td><td style="color:var(--text-muted);font-size:12px;">${l.reason||'—'}</td><td><span class="badge ${cls}">${label}</span></td></tr>`;
    }).join('')}
    </tbody></table>`}
  </div>
  <div class="card">
    <div class="section-title">سجل دوامي <span style="font-size:11px;color:var(--text-faint);font-weight:600;">دوامك المطلوب: ${exp} ساعة يوميًا</span></div>
    ${mine.length===0?`<div class="empty">لا يوجد سجل دوام بعد</div>`:`
    <table><thead><tr><th>التاريخ</th><th>الحضور</th><th>الانصراف</th><th>ساعات العمل</th><th>الحالة</th></tr></thead><tbody>
    ${mine.map(a=>{
      const worked = hoursDiff(a.checkIn, a.checkOut);
      const hoursTxt = a.checkOut ? `<span style="color:${worked>=exp?'var(--success)':'var(--warning)'};font-weight:700;">${worked}س${worked<exp?' ⚠️':' ✅'}</span>` : '—';
      return `<tr><td>${fmtDate(a.date)}</td><td>${a.checkIn||'—'}</td><td>${a.checkOut||'—'}</td><td>${hoursTxt}</td><td>${statusBadge(a.status)}</td></tr>`;
    }).join('')}
    </tbody></table>`}
  </div>`;
}

      clientDropdown.innerHTML = html;
      clientDropdown.classList.add('show');
    };
    clientInput.addEventListener('input', renderSuggestions);
    clientInput.addEventListener('focus', renderSuggestions);

    });

/* ---------------- PWA: تثبيت التطبيق على الجوال ---------------- */
let deferredInstallPrompt = null;

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{ /* لا يمنع عمل الموقع لو فشل */ });
  });
}

// أندرويد/كروم: المتصفح بيعطينا فرصة نعرض زر تثبيت مخصص
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner('android');
});

function isRunningStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
function installBannerDismissed(){
  try{ return localStorage.getItem('sa_install_dismissed') === '1'; }catch(e){ return false; }
}

function showInstallBanner(platform){
  if(isRunningStandalone() || installBannerDismissed()) return;
  if(document.getElementById('pwaInstallBanner')) return;

  const isApple = platform === 'ios';
  const el = document.createElement('div');
  el.id = 'pwaInstallBanner';
  el.className = 'pwa-banner';
  el.innerHTML = `
    <img src="assets/icons/icon-192.png" alt="" class="pwa-banner-icon"/>
    <div style="flex:1;min-width:0;">
      <div style="font-weight:800;font-size:13px;">ثبّت سوبر آبل على جوالك</div>
      <div style="font-size:11.5px;color:var(--text-muted);line-height:1.6;">
        ${isApple
          ? 'دوس زر المشاركة <b>⬆️</b> بأسفل سفاري، ثم اختر <b>«إضافة إلى الشاشة الرئيسية»</b>'
          : 'افتحه كتطبيق مستقل بضغطة وحدة، بدون متجر تطبيقات'}
      </div>
    </div>
    <div style="display:flex;gap:6px;flex:none;align-items:center;">
      ${isApple ? '' : '<button class="btn btn-primary btn-sm" id="pwaInstallBtn">تثبيت</button>'}
      <button class="pwa-banner-close" id="pwaDismissBtn" aria-label="إغلاق">✕</button>
    </div>`;
  document.body.appendChild(el);

  document.getElementById('pwaInstallBtn')?.addEventListener('click', async ()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    el.remove();
  });
  document.getElementById('pwaDismissBtn')?.addEventListener('click', ()=>{
    try{ localStorage.setItem('sa_install_dismissed','1'); }catch(e){}
    el.remove();
  });
}

// آيفون: ما فيه حدث تلقائي، فبنعرض التعليمات يدويًا بعد ما يسجل الدخول
setTimeout(()=>{
  if(isIOS() && !isRunningStandalone() && state.currentUser) showInstallBanner('ios');
}, 3000);
